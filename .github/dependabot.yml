version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    # Minor- und Patch-Updates als ein Sammel-PR pro Woche; Major-Updates
    # (React, Vite, Vitest, TypeScript …) kommen einzeln, weil sie Code-
    # Anpassungen brauchen können.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
